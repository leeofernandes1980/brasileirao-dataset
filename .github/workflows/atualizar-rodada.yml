name: Atualizar Rodada Brasileirão

on:
  schedule:
    # A cada 3 horas (UTC). Ajuste conforme os horários dos jogos.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      rodada:
        description: "Rodada específica para atualizar (vazio = verifica todas)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: atualizar-rodada
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: [self-hosted, windows, brasileirao]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: py -3.12 -m pip install -r datalake/requirements.txt

      - name: Ingestão Sofascore (partidas + gols/cartões/estatísticas)
        working-directory: datalake/pipelines
        env:
          RODADA: ${{ github.event.inputs.rodada }}
        run: |
          if [ -n "$RODADA" ]; then
            py -3.12 -W ignore ingest_sofascore.py --seasons 2026 --round "$RODADA"
          else
            py -3.12 -W ignore ingest_sofascore.py --seasons 2026
          fi

      - name: Reconstruir camada Gold
        working-directory: datalake/pipelines
        run: py -3.12 -W ignore build_gold.py

      - name: Exportar dados para o dashboard
        working-directory: dashboard/scripts
        run: py -3.12 -W ignore export_data.py

      - name: Commit e push se houver dados novos
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datalake/silver datalake/gold dashboard/public/data
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados — nada para publicar."
            exit 0
          fi
          git commit -m "data: atualização automática de rodada (GitHub Actions)"

          # Os arquivos gerados (parquet/json) mudam a cada execução, então em
          # caso de corrida com outro run só existe conflito de conteúdo
          # binário/derivado — resolvemos sempre a favor da versão que acabamos
          # de gerar (-X ours) em vez de deixar o push falhar.
          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            if git merge -X ours --no-edit origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git merge --abort || true
            fi
            echo "Push falhou (tentativa $tentativa/5), tentando novamente..."
            sleep $((RANDOM % 10 + 5))
          done

          echo "::error::Não foi possível publicar os dados após 5 tentativas."
          exit 1
