name: Atualizar Rodada Brasileirão

on:
  schedule:
    # A cada 12 horas (UTC). Reduzido de 3/3h para poupar a API do Sofascore
    # enquanto o bloqueio 403 persistir (ver checkpoint de troubleshooting).
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      rodada:
        description: "Rodada específica (vazio = detecta a rodada atual automaticamente; 'todas' = varre o campeonato inteiro)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: atualizar-rodada
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: [self-hosted, windows, brasileirao]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configurar git safe.directory
        # actions/checkout só registra o safe.directory num HOME temporário
        # (descartado ao final do próprio step), então o .gitconfig real do
        # runner self-hosted nunca recebe essa exceção. Sem isso, qualquer
        # "git config"/"git commit" rodado nos steps seguintes falha com
        # "fatal: not in a git directory" (dubious ownership tratado como
        # "repositório não encontrado" pelo git nesse comando).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Instalar dependências
        run: py -3.12 -m pip install -r datalake/requirements.txt

      - name: Determinar rodada atual
        if: github.event.inputs.rodada == ''
        working-directory: datalake/pipelines
        continue-on-error: true  # falha aqui não deve travar a run — cai no scan completo
        run: |
          RODADA_ATUAL=$(py -3.12 -W ignore rodada_atual.py --seasons 2026)
          echo "Rodada atual detectada: $RODADA_ATUAL"
          echo "RODADA_ATUAL=$RODADA_ATUAL" >> "$GITHUB_ENV"

      - name: Ingestão Sofascore (partidas + gols/cartões/estatísticas)
        working-directory: datalake/pipelines
        env:
          RODADA: ${{ github.event.inputs.rodada }}
        run: |
          # Roda agendada / sem input manual: busca só a rodada atual
          # (detectada no step anterior) em vez de varrer o campeonato
          # inteiro — evita disparar o rate-limit/403 do Sofascore.
          # 'todas' força o scan completo (uso manual/depuração).
          if [ "$RODADA" = "todas" ]; then
            py -3.12 -W ignore ingest_sofascore.py --seasons 2026
          else
            ALVO="${RODADA:-$RODADA_ATUAL}"
            if [ -n "$ALVO" ]; then
              py -3.12 -W ignore ingest_sofascore.py --seasons 2026 --round "$ALVO"
            else
              py -3.12 -W ignore ingest_sofascore.py --seasons 2026
            fi
          fi

      - name: Reconstruir camada Gold
        working-directory: datalake/pipelines
        run: py -3.12 -W ignore build_gold.py

      - name: Exportar dados para o dashboard
        working-directory: dashboard/scripts
        run: py -3.12 -W ignore export_data.py

      - name: Commit e push se houver dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datalake/silver datalake/gold dashboard/public/data
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados — nada para publicar."
            exit 0
          fi
          git commit -m "data: atualização automática de rodada (GitHub Actions)"

          # Os arquivos gerados (parquet/json) mudam a cada execução, então em
          # caso de corrida com outro run só existe conflito de conteúdo
          # binário/derivado — resolvemos sempre a favor da versão que acabamos
          # de gerar (-X ours) em vez de deixar o push falhar.
          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            if git merge -X ours --no-edit origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git merge --abort || true
            fi
            echo "Push falhou (tentativa $tentativa/5), tentando novamente..."
            sleep $((RANDOM % 10 + 5))
          done

          echo "::error::Não foi possível publicar os dados após 5 tentativas."
          exit 1
