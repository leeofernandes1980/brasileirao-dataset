name: Atualizar Rodada Brasileirão

on:
  schedule:
    # A cada 12 horas (UTC). Reduzido de 3/3h para poupar a API do Sofascore
    # enquanto o bloqueio 403 persistir (ver checkpoint de troubleshooting).
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      rodada:
        description: "Rodada específica (vazio = detecta automaticamente todas as rodadas pendentes; 'todas' = varre o campeonato inteiro)"
        required: false
        type: string
      fallback_rapidapi:
        description: "Usar fallback RapidAPI (SportAPI) se o Sofascore bloquear com 403 — cota gratuita de só 50 req/mês, ligar apenas quando necessário"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar-rodada
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: [self-hosted, windows, brasileirao]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configurar git safe.directory
        # actions/checkout só registra o safe.directory num HOME temporário
        # (descartado ao final do próprio step), então o .gitconfig real do
        # runner self-hosted nunca recebe essa exceção. Sem isso, qualquer
        # "git config"/"git commit" rodado nos steps seguintes falha com
        # "fatal: not in a git directory" (dubious ownership tratado como
        # "repositório não encontrado" pelo git nesse comando).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Instalar dependências
        run: py -3.12 -m pip install -r datalake/requirements.txt

      - name: Determinar rodadas pendentes
        if: github.event.inputs.rodada == ''
        working-directory: datalake/pipelines
        continue-on-error: true  # falha aqui não deve travar a run — só não busca nada nesta execução
        run: |
          # "Pendente" = qualquer partida marcada "notstarted" com data já
          # passada — cobre a rodada da semana E qualquer rodada anterior
          # que ficou pra trás (jogo remarcado, atraso de captura etc.),
          # sem depender de qual rodada "parece" ser a atual.
          RODADAS=$(py -3.12 -W ignore rodada_atual.py --seasons 2026)
          echo "Rodadas pendentes detectadas: ${RODADAS:-<nenhuma>}"
          echo "RODADAS_PENDENTES=$RODADAS" >> "$GITHUB_ENV"

      - name: Ingestão Sofascore (partidas + gols/cartões/estatísticas)
        working-directory: datalake/pipelines
        env:
          RODADA: ${{ github.event.inputs.rodada }}
          SOFASCORE_RAPIDAPI_FALLBACK: ${{ github.event.inputs.fallback_rapidapi == 'true' && '1' || '' }}
        run: |
          # Roda agendada / sem input manual: busca só as rodadas com
          # partida pendente (detectadas no step anterior) em vez de
          # varrer o campeonato inteiro — evita disparar o rate-limit/403
          # do Sofascore. 'todas' força o scan completo (uso manual/depuração).
          if [ "$RODADA" = "todas" ] || [ "$RODADAS_PENDENTES" = "todas" ]; then
            py -3.12 -W ignore ingest_sofascore.py --seasons 2026
          elif [ -n "$RODADA" ]; then
            py -3.12 -W ignore ingest_sofascore.py --seasons 2026 --round "$RODADA"
          elif [ -n "$RODADAS_PENDENTES" ]; then
            for r in $RODADAS_PENDENTES; do
              echo "== Buscando rodada $r =="
              py -3.12 -W ignore ingest_sofascore.py --seasons 2026 --round "$r"
            done
          else
            echo "Nenhuma rodada pendente — nada a buscar nesta execução."
          fi

      - name: Verificar se a ingestão trouxe dados novos
        # A ingestão engole 403/429 do Sofascore como skip silencioso (pra não
        # travar a run com um bloqueio temporário de terceiro) — então a run
        # pode ficar 100% verde sem ter buscado nenhum dado novo, mascarando
        # o problema. Este step só reconfere se as rodadas que estavam
        # pendentes antes da ingestão continuam pendentes depois: se sim,
        # é sinal de bloqueio persistente (não de "nada pra buscar mesmo").
        if: env.RODADAS_PENDENTES != '' && env.RODADAS_PENDENTES != 'todas'
        working-directory: datalake/pipelines
        continue-on-error: true
        run: |
          AINDA_PENDENTES=$(py -3.12 -W ignore rodada_atual.py --seasons 2026)
          if [ -n "$AINDA_PENDENTES" ]; then
            echo "::warning::Rodada(s) detectada(s) como pendente(s) antes da ingestão ($RODADAS_PENDENTES) continuam sem resultado depois (ainda pendente(s): $AINDA_PENDENTES). Provável bloqueio 403 do Sofascore no IP deste runner — veja o log do step 'Ingestão Sofascore'. O commit desta run (se houver) não contém os placares dessas partidas."
          fi

      - name: Reconstruir camada Gold
        working-directory: datalake/pipelines
        run: py -3.12 -W ignore build_gold.py

      - name: Exportar dados para o dashboard
        working-directory: dashboard/scripts
        run: py -3.12 -W ignore export_data.py

      - name: Commit e push se houver dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datalake/silver datalake/gold dashboard/public/data
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados — nada para publicar."
            exit 0
          fi
          git commit -m "data: atualização automática de rodada (GitHub Actions)"

          # Os arquivos gerados (parquet/json) mudam a cada execução, então em
          # caso de corrida com outro run só existe conflito de conteúdo
          # binário/derivado — resolvemos sempre a favor da versão que acabamos
          # de gerar (-X ours) em vez de deixar o push falhar.
          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            if git merge -X ours --no-edit origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git merge --abort || true
            fi
            echo "Push falhou (tentativa $tentativa/5), tentando novamente..."
            sleep $((RANDOM % 10 + 5))
          done

          echo "::error::Não foi possível publicar os dados após 5 tentativas."
          exit 1
